name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        env:
          # One retry per failed test; scripts/flaky-reporter.mjs lists every test that needed it.
          COS_TEST_RETRY: '1'
        run: npm run verify:ci

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install plugin Python runtime
        run: python -m pip install uv==0.12.5

      - name: Exercise published plugins on this OS
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        # These suites install full npm/Python environments and immediately start
        # their servers. Give each cold start the runner without competing installs.
        run: npx vitest run --maxWorkers=1 test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts

  external-orchestrator:
    name: External Orchestrator ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            artifact: windows-x64
          - name: macOS arm64
            runner: macos-15
            artifact: macos-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/external-orchestrator/package-lock.json

      - name: Install standalone connector dependencies
        run: npm --prefix plugins/external-orchestrator ci --ignore-scripts --no-audit --no-fund

      - name: Verify standalone connector and deterministic MCPB
        run: npm --prefix plugins/external-orchestrator run verify

      - name: Upload native-runner MCPB proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-orchestrator-${{ matrix.artifact }}
          path: |
            plugins/external-orchestrator/release/*.mcpb
            plugins/external-orchestrator/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  external-orchestrator-reproducibility:
    name: External Orchestrator cross-platform bytes
    needs: external-orchestrator
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: external-orchestrator-*
          path: external-orchestrator-artifacts

      - name: Require one identical unsigned MCPB from every OS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find external-orchestrator-artifacts -type f -name '*.mcpb' | sort)
          if [ "${#bundles[@]}" -ne 3 ]; then
            printf 'Expected three MCPB artifacts, found %s\n' "${#bundles[@]}" >&2
            exit 1
          fi
          first="$(sha256sum "${bundles[0]}" | awk '{print $1}')"
          for bundle in "${bundles[@]}"; do
            current="$(sha256sum "$bundle" | awk '{print $1}')"
            printf '%s  %s\n' "$current" "$bundle"
            test "$current" = "$first"
          done

  ui:
    # The real-Electron UI checks (scripts/verify-*.cjs) catch layout and interaction bugs the unit
    # tests cannot see. They take several minutes, so they run only when the interface can change.
    name: UI checks (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the interface can change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/renderer/|src/preload/|src/shared/|extension/|scripts/verify-|scripts/fixtures/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No interface files changed; the UI checks are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Build the app
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Run the UI checks
        if: steps.scope.outputs.run == 'true'
        env:
          # Pixel comparisons, animation timing and a transparent overlay window need a real GPU; the
          # hosted runner has none. They run with npm run verify:ui on a real machine.
          VERIFY_UI_SKIP: verify-plan-collapse.cjs,verify-settings-focus.cjs,verify-pet-overlay-electron.cjs,verify-message-reactions.cjs
          # The shared runner times out a different check now and then; one retry each, named as flaky.
          VERIFY_UI_RETRY: '1'
        run: npm run verify:ui

      - name: Keep the UI check screenshots when a check fails
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-check-screenshots-${{ github.run_id }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7
